[package]
name = "napkin-cli"
description = "Napkin on the command line: `napkin \"20 inches in cm\"`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "napkin"
path = "src/main.rs"

[dependencies]
napkin-core.workspace = true
napkin-rates.workspace = true
napkin-extensions.workspace = true
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
percent-encoding = "2.3"
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"

# The system language for `--language auto`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
